[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ams-telemetry"
version = "0.1.0"
description = "Professional Motorsport Telemetry Studio & Hexagonal Binary Log Parser for AMS Black-Box"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
ams-parser = "AMS_Parser.main:main"
AMS_Parser = "AMS_Parser.main:main"
ams-telemetry = "ams_telemetry_studio.app:main"
AMS_Telemetry = "ams_telemetry_studio.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
